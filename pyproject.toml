[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "race-bot"
version = "0.1.0"
description = "Tactical analysis of live cycling races from text commentary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
ai = ["pydantic-ai-slim[openai]>=0.0.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
race-bot = "race_bot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["race_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
