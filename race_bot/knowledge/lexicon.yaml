# Vocabulary for the deterministic pre-filter. No model involved — this is
# tuned by editing the lists, not by editing Python.

# Phrases that mark a post as filler rather than race description.
noise_markers:
  - "brought to you by"
  - "in partnership with"
  - "subscribe"
  - "sign up"
  - "click here"
  - "watch live on"
  - "available to stream"
  - "follow us on"
  - "read more"
  - "full report"
  - "photo:"
  - "image:"
  - "getty images"
  - "good morning"
  - "good afternoon"
  - "welcome to our live coverage"
  - "welcome back to"
  - "thanks for joining"
  - "stay with us"
  - "don't go anywhere"
  - "quick reminder"
  - "if you missed it"

# Phrases that mark a post as a results/standings dump.
result_markers:
  - "general classification"
  - "points classification"
  - "mountains classification"
  - "young rider classification"
  - "top ten"
  - "top 10"
  - "intermediate sprint result"
  - "stage result"
  - "provisional result"
  - "how they finished"

# Words that make a post tactically interesting. Drives the salience score,
# which decides what survives when the context window is full.
